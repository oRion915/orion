<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GPS Tracker Dashboard</title>

    <link rel="stylesheet" href="/static/style.css">

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

</head>

<body>

<header>

    <h1>🛰 GPS Tracker Dashboard</h1>

    <div id="systemStatus">
        🟢 LIVE
    </div>

</header>

<div class="container">

    <div class="sidebar">

        <h2>📍 Vehicle Status</h2>

        <div class="card">
            <label>🛰 Latitude</label>
            <span id="latitude">--</span>
        </div>

        <div class="card">
            <label>🌍 Longitude</label>
            <span id="longitude">--</span>
        </div>

        <div class="card">
            <label>🚗 Speed</label>
            <span id="speed">0 km/h</span>
        </div>

        <div class="card">
            <label>🧭 Heading</label>
            <span id="heading">--</span>
        </div>

        <div class="card">
            <label>📏 Distance</label>
            <span id="distance">0 m</span>
        </div>

        <div class="card">
            <label>📌 Total Points</label>
            <span id="points">0</span>
        </div>

        <div class="card">
            <label>⏰ Last Update</label>
            <span id="updated">--</span>
        </div>

        <div class="card">
            <label>🔋 Status</label>
            <span id="status">Waiting...</span>
        </div>

        <button id="centerButton">
            🎯 Center Map
        </button>

        <button id="clearButton">
            🗑 Clear History
        </button>

    </div>

    <div class="map-area">

        <div id="map"></div>

        <div class="analytics">

            <div class="stat">
                <h4>Today's Distance</h4>
                <p id="todayDistance">0 km</p>
            </div>

            <div class="stat">
                <h4>Average Speed</h4>
                <p id="avgSpeed">0 km/h</p>
            </div>

            <div class="stat">
                <h4>Trip Duration</h4>
                <p id="tripTime">00:00</p>
            </div>

            <div class="stat">
                <h4>Total Stops</h4>
                <p id="stops">0</p>
            </div>

        </div>

    </div>

</div>

<script src="/static/app.js"></script>

</body>
</html>

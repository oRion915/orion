<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GPS Tracker Dashboard</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:#121212;
            color:white;
            overflow:hidden;

        }

        /* ===========================
           Header
        =========================== */

        header{

            height:70px;

            background:#1d1d1d;

            display:flex;

            align-items:center;

            justify-content:space-between;

            padding:0 30px;

            border-bottom:1px solid #333;

        }

        header h1{

            font-size:34px;

            font-weight:700;

        }

        #systemStatus{

            color:#41ff73;

            font-weight:bold;

            font-size:18px;

        }

        /* ===========================
           Main Layout
        =========================== */

        .container{

            display:flex;

            height:calc(100vh - 70px);

        }

        /* ===========================
           Sidebar
        =========================== */

        .sidebar{

            width:340px;

            background:#1b1b1b;

            padding:25px;

            overflow-y:auto;

            border-right:1px solid #333;

        }

        .sidebar h2{

            margin-bottom:20px;

        }

        .card{

            background:#272727;

            border-radius:12px;

            padding:15px;

            margin-bottom:15px;

        }

        .card label{

            display:block;

            color:#999;

            font-size:13px;

            margin-bottom:6px;

        }

        .card span{

            color:#53a7ff;

            font-size:20px;

            font-weight:bold;

        }

        button{

            width:100%;

            margin-top:12px;

            padding:14px;

            border:none;

            border-radius:10px;

            cursor:pointer;

            font-size:15px;

            font-weight:bold;

        }

        #centerButton{

            background:#2196F3;

            color:white;

        }

        #clearButton{

            background:#ff4b4b;

            color:white;

        }

        button:hover{

            opacity:.9;

        }

        /* ===========================
           Map
        =========================== */

        .map-area{

            flex:1;

            position:relative;

        }

        #map{

            width:100%;

            height:100%;

        }

        /* ===========================
           Floating Analytics
        =========================== */

        .analytics{

            position:absolute;

            left:25px;

            bottom:25px;

            display:flex;

            gap:15px;

            z-index:999;

        }

        .stat{

            background:rgba(25,25,25,.9);

            backdrop-filter:blur(10px);

            border:1px solid rgba(255,255,255,.08);

            border-radius:12px;

            padding:14px 18px;

            min-width:160px;

        }

        .stat h4{

            color:#999;

            margin-bottom:6px;

            font-size:13px;

        }

        .stat p{

            font-size:22px;

            color:#53a7ff;

            font-weight:bold;

        }

    </style>

</head>

<body>

<header>

    <h1>🛰 GPS Tracker Dashboard</h1>

    <div id="systemStatus">
        🟢 LIVE
    </div>

</header>

<div class="container">

    <div class="sidebar">

        <h2>📍 Vehicle Status</h2>

        <div class="card">
            <label>🛰 Latitude</label>
            <span id="latitude">--</span>
        </div>

        <div class="card">
            <label>🌍 Longitude</label>
            <span id="longitude">--</span>
        </div>

        <div class="card">
            <label>🚗 Speed</label>
            <span id="speed">0 km/h</span>
        </div>

        <div class="card">
            <label>🧭 Heading</label>
            <span id="heading">--</span>
        </div>

        <div class="card">
            <label>📏 Distance</label>
            <span id="distance">0 m</span>
        </div>

        <div class="card">
            <label>📌 Total Points</label>
            <span id="points">0</span>
        </div>

        <div class="card">
            <label>⏰ Last Update</label>
            <span id="updated">--</span>
        </div>

        <div class="card">
            <label>🔋 Status</label>
            <span id="status">Waiting...</span>
        </div>

        <button id="centerButton">
            🎯 Center Map
        </button>

        <button id="clearButton">
            🗑 Clear History
        </button>

    </div>

    <div class="map-area">

        <div id="map"></div>

        <div class="analytics">

            <div class="stat">
                <h4>Today's Distance</h4>
                <p id="todayDistance">0 km</p>
            </div>

            <div class="stat">
                <h4>Average Speed</h4>
                <p id="avgSpeed">0 km/h</p>
            </div>

            <div class="stat">
                <h4>Trip Duration</h4>
                <p id="tripTime">00:00</p>
            </div>

            <div class="stat">
                <h4>Total Stops</h4>
                <p id="stops">0</p>
            </div>

        </div>

    </div>

</div>

<script src="/static/app.js"></script>

</body>
</html>
